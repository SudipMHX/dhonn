<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>Offline | dhonn.</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #020617;
        color: #e2e8f0;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        width: min(100%, 560px);
      }
      h1 {
        margin-bottom: 8px;
      }
      p {
        color: #94a3b8;
      }
      ul {
        display: grid;
        gap: 12px;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 16px;
        border: 1px solid #1e293b;
        border-radius: 16px;
        background: #0f172a;
      }
      audio {
        display: block;
        width: 100%;
        margin-top: 8px;
      }
      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Sounds you have already played are saved on this device and can be
        replayed below. Connect to the internet to discover more sounds.
      </p>
      <ul id="saved-sounds"></ul>
      <p id="empty-message" hidden>
        No sounds have been saved yet. Play a sound while online to make it
        available offline.
      </p>
      <p><a href="/">Try dhonn. again</a></p>
    </main>
    <script>
      const list = document.querySelector("#saved-sounds")
      const emptyMessage = document.querySelector("#empty-message")

      async function showSavedSounds() {
        if (!("caches" in window)) {
          emptyMessage.hidden = false
          return
        }

        const cache = await caches.open("dhonn-offline-v1")
        const requests = await cache.keys()
        const audioRequests = requests.filter((request) =>
          new URL(request.url).pathname.match(
            /^\/api\/sounds\/[^/]+\/audio$/,
          ),
        )

        for (const request of audioRequests) {
          const url = new URL(request.url)
          const slug = decodeURIComponent(url.pathname.split("/").at(-2))
          const item = document.createElement("li")
          const title = document.createElement("strong")
          const audio = document.createElement("audio")
          title.textContent = slug
          audio.controls = true
          audio.preload = "none"
          audio.src = request.url
          item.append(title, audio)
          list.append(item)
        }

        emptyMessage.hidden = audioRequests.length > 0
      }

      showSavedSounds().catch(() => {
        emptyMessage.hidden = false
      })
    </script>
  </body>
</html>
